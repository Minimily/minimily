<div class="modal fade" id="good-modal" tabindex="-1" aria-labelledby="good-modal-label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="good-form" method="post" action="{% if good_id %}/shopping/goods/{{ good_id }}/edit{% else %}/shopping/goods{% endif %}" enctype="application/x-www-form-urlencoded">
                {% if good_form.return_to %}<input type="hidden" name="return_to" value="{{ good_form.return_to }}">{% endif %}
                <div class="modal-header">
                    <h5 class="modal-title" id="good-modal-label">{% if good_id %}Edit Good{% else %}Add Good{% endif %}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" class="form-control" id="name" name="name" maxlength="100" value="{{ good_form.name }}" required>
                        <span class="error">{{ good_errors["name"] }}</span>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ good_form.description | default(value="") }}</textarea>
                        <span class="error">{{ good_errors["description"] }}</span>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <select class="form-select" id="location" name="location">
                            <option value="">No location</option>
                            {% for location in locations | default(value=[]) %}
                                <option value="{{ location.id }}"{% if good_form.location and good_form.location == location.id | as_str %} selected{% endif %}>{{ location.name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error">{{ good_errors["location"] }}</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
